# Helmbulance's own CI: vet, unit tests and govulncheck, then every case of the verdict table
# (testdata/verdicts.yaml) on kind under Helm 4 and Helm 3. Follows the CI row of the security model
# (docs/architecture.md §4): runs on pull_request, never pull_request_target; read-only token; no
# secrets, no caches; actions pinned by commit SHA; downloaded tools pinned by version and checksum.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Every night on main, with every case of the verdict table run three times: a verdict that changes
  # between runs of the same chart shows up here and not on a pull request.
  schedule:
    - cron: "17 3 * * *"

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: vet, test, govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  fixtures:
    # The job names stay the same when a Helm version is bumped, so required checks keep matching.
    name: fixtures (Helm ${{ matrix.major }})
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: 4
            helm: v4.3.0
            helm-sha256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
          - major: 3
            helm: v3.22.0
            helm-sha256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.37.1
      KUBECTL_SHA256: 65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8
      HELM_VERSION: ${{ matrix.helm }}
      HELM_SHA256: ${{ matrix.helm-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install kind, kubectl and helm
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSLo "$bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          echo "$KIND_SHA256  $bin/kind" | sha256sum -c -
          curl -fsSLo "$bin/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$KUBECTL_SHA256  $bin/kubectl" | sha256sum -c -
          curl -fsSLo "$RUNNER_TEMP/helm.tar.gz" "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          mv "$RUNNER_TEMP/linux-amd64/helm" "$bin/helm"
          chmod +x "$bin/kind" "$bin/kubectl" "$bin/helm"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          kind version
          kubectl version --client
          helm version

      - run: go build -o bin/helmbulance ./cmd/helmbulance

      # fixtures.sh runs every case of testdata/verdicts.yaml (test, scan and matrix) and compares
      # the exit code, the verdict of every scenario and the findings with the table. It also fails
      # when a finding ID in the source has no pair in the table (docs/verdict-quality.md).
      - name: Verdict table
        env:
          OUT: ${{ runner.temp }}/verdicts
          REPEAT: ${{ github.event_name == 'schedule' && '3' || '1' }}
        run: scripts/fixtures.sh -out "$OUT" -repeat "$REPEAT"

      - name: Job summary
        if: always()
        run: cat "$RUNNER_TEMP/verdicts/scorecard.md" >> "$GITHUB_STEP_SUMMARY" || echo "No scorecard was written." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verdicts-helm-${{ matrix.helm }}
          path: ${{ runner.temp }}/verdicts
          retention-days: 7

  # How many small changes to the code the unit tests notice, per package (docs/verdict-quality.md).
  # Report only: it has no threshold and is not a required check.
  mutation:
    name: mutation (report)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # tee: the report is in the job log as well as in the summary.
      - run: scripts/mutation.sh "$RUNNER_TEMP/mutation" | tee -a "$GITHUB_STEP_SUMMARY"

  # The composite Action (action.yml) on one fixture pair. The fixed twin runs with variables that
  # would point helm at another cluster; the Action must drop them, or helm fails to connect.
  action:
    name: action (fixture pair)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Defective chart
        id: bad
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository] only this commit is checked out; switch to $/ once confirmed for a root action
        with:
          chart: testdata/charts/regenerates-secret
          scenarios: upgrade-without-values
          timeout: 3m
          report-dir: reports/bad

      - name: Fixed twin, with a hostile helm environment
        id: good
        uses: ./ # zizmor: ignore[self-repository] only this commit is checked out; switch to $/ once confirmed for a root action
        env:
          HELM_KUBEAPISERVER: https://127.0.0.1:1
          HELM_KUBETOKEN: not-a-token
        with:
          chart: testdata/charts/keeps-secret
          scenarios: upgrade-without-values
          timeout: 3m
          report-dir: reports/good

      # allow-remote is off by default, so a chart that is not on disk is refused before any cluster
      # exists. The name is never resolved.
      - name: Remote chart, not allowed
        id: remote
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository] only this commit is checked out; switch to $/ once confirmed for a root action
        with:
          chart: oci://registry.invalid/helmbulance/none
          report-dir: reports/remote

      # One test per line: under `bash -e` only the last command of an `&&` list can fail the step.
      - name: Check outcomes
        env:
          BAD_OUTCOME: ${{ steps.bad.outcome }}
          BAD_CODE: ${{ steps.bad.outputs.exit-code }}
          BAD_VERDICT: ${{ steps.bad.outputs.verdict }}
          GOOD_CODE: ${{ steps.good.outputs.exit-code }}
          GOOD_VERDICT: ${{ steps.good.outputs.verdict }}
          REMOTE_OUTCOME: ${{ steps.remote.outcome }}
          REMOTE_CODE: ${{ steps.remote.outputs.exit-code }}
          REMOTE_VERDICT: ${{ steps.remote.outputs.verdict }}
        run: |
          echo "defective: outcome=$BAD_OUTCOME exit=$BAD_CODE verdict=$BAD_VERDICT"
          echo "fixed:     exit=$GOOD_CODE verdict=$GOOD_VERDICT"
          echo "remote:    outcome=$REMOTE_OUTCOME exit=$REMOTE_CODE verdict=$REMOTE_VERDICT"
          [ "$BAD_OUTCOME" = failure ]
          [ "$BAD_CODE" = 1 ]
          [ "$BAD_VERDICT" = FAIL ]
          [ "$GOOD_CODE" = 0 ]
          [ "$GOOD_VERDICT" = PASS ]
          [ "$REMOTE_OUTCOME" = failure ]
          [ "$REMOTE_CODE" = 2 ]
          [ "$REMOTE_VERDICT" = ERROR ]
          test -s reports/bad/report.md
          test -s reports/good/report.md
          test ! -e reports/remote/report.md
